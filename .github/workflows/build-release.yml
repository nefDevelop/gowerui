name: Test and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  WAILS_VERSION: v2.12.0
  WAILS_TAGS: webkit2_41

jobs:
  test:
    name: Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: lint
        run: make lint

      - name: typecheck
        run: make typecheck

      - name: unit tests
        run: make test-unit

      - name: integration tests
        run: make test-integration

      - name: read gower sidecar pin
        id: sidecar
        run: echo "tag=$(tr -d '[:space:]' < .gower-version)" >> "$GITHUB_OUTPUT"

      - name: contract test (pinned gower)
        # Descarga el binario y el contrato del tag pineado y verifica que las
        # claves --json que consume el frontend siguen presentes. Sin esto, un
        # cambio de esquema en gower degradaría la UI en silencio.
        shell: bash
        env:
          GOWER_BIN: ${{ github.workspace }}/contract/gower
          GOWER_CONTRACT: ${{ github.workspace }}/contract/gower-contract.json
        run: |
          set -euo pipefail
          TAG="${{ steps.sidecar.outputs.tag }}"
          mkdir -p contract
          curl -fSL --retry 3 --retry-all-errors \
            -o contract/gower \
            "https://github.com/nefDevelop/gower/releases/download/$TAG/gower"
          chmod +x contract/gower
          curl -fSL --retry 3 --retry-all-errors \
            -o contract/gower-contract.json \
            "https://raw.githubusercontent.com/nefDevelop/gower/$TAG/contract/gower-contract.json"
          make test-contract

  build-release:
    name: Build (${{ matrix.platform }})
    needs: test
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04"
            wails_platform: "linux/amd64"
            binary_name: "gowerui"
            sidecar_asset: "gower"
          - platform: "windows-latest"
            wails_platform: "windows/amd64"
            binary_name: "gowerui.exe"
            sidecar_asset: "gower.exe"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: install system dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: read app version
        id: app
        shell: bash
        run: |
          VERSION=$(node -p "require('./wails.json').info.productVersion")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "gowerui $VERSION" >> $GITHUB_STEP_SUMMARY

      - name: read gower sidecar pin
        id: sidecar
        shell: bash
        run: |
          set -euo pipefail
          TAG=$(tr -d '[:space:]' < .gower-version)
          if [ -z "$TAG" ]; then
            echo "::error::.gower-version está vacío o no existe"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "gower sidecar pinned to $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: fetch pinned gower sidecar
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="nefDevelop/gower"
          TAG="${{ steps.sidecar.outputs.tag }}"
          ASSET="${{ matrix.sidecar_asset }}"
          # Tag fijado, no "latest": un release debe ser reproducible y
          # reversible. Se descarga por URL de release en vez de por la API.
          URL="https://github.com/$REPO/releases/download/$TAG/$ASSET"
          mkdir -p sidecar
          echo "Fetching $ASSET from $REPO@$TAG..."
          # -f hace fallar el curl si el tag o el asset no existen: mejor un
          # error ruidoso aquí que empaquetar un bundle sin motor.
          curl -fSL --retry 3 --retry-all-errors \
            -H "Authorization: token $GH_TOKEN" "$URL" -o "sidecar/$ASSET"
          # Integridad: la release publica checksums.txt (lo genera gower).
          curl -fSL --retry 3 --retry-all-errors \
            -H "Authorization: token $GH_TOKEN" \
            "https://github.com/$REPO/releases/download/$TAG/checksums.txt" \
            -o sidecar/checksums.txt
          EXPECTED=$(awk -v a="/$ASSET" '$2 == a {print $1}' sidecar/checksums.txt)
          if command -v sha256sum >/dev/null 2>&1; then HASHER="sha256sum"; else HASHER="shasum -a 256"; fi
          ACTUAL=$($HASHER "sidecar/$ASSET" | awk '{print $1}')
          if [ -z "$EXPECTED" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::checksum no coincide para $ASSET (esperado '$EXPECTED', real '$ACTUAL')"
            exit 1
          fi
          echo "checksum OK para $ASSET"
          chmod +x "sidecar/$ASSET" || true
          # El JSON de la UI se deriva del pin, no de la respuesta de la API.
          bash scripts/render-sidecar-info.sh "$ASSET"
          cat frontend/src/lib/sidecar-info.json >> "$GITHUB_STEP_SUMMARY"

      - name: build wails app
        shell: bash
        run: |
          set -euo pipefail
          # La versión viaja al binario por ldflags para que la UI pueda
          # mostrarla sin una segunda fuente de verdad.
          VERSION=$(node -p "require('./wails.json').info.productVersion")
          wails build -tags ${{ env.WAILS_TAGS }} -platform ${{ matrix.wails_platform }} \
            -o ${{ matrix.binary_name }} \
            -ldflags "-X main.version=$VERSION"

      - name: package (linux)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gowerui-linux-portable final-assets
          cp "build/bin/${{ matrix.binary_name }}" gowerui-linux-portable/
          cp "sidecar/${{ matrix.sidecar_asset }}" gowerui-linux-portable/gower
          cp frontend/static/favicon.png gowerui-linux-portable/icon.png

          cat <<'EOF' > gowerui-linux-portable/gowerui.desktop
          [Desktop Entry]
          Name=Gower UI
          Comment=GUI for Gower Wallpaper Engine
          Exec=sh -c "cd $(dirname %k) && ./gowerui"
          Icon=$(dirname %k)/icon.png
          Terminal=false
          Type=Application
          Categories=Utility;Graphics;
          EOF

          printf '# Gower UI - Portable Linux\n\n## Ejecucion: ./gowerui\n' > gowerui-linux-portable/README.md

          chmod +x gowerui-linux-portable/gowerui gowerui-linux-portable/gower
          tar -czf gowerui-linux-portable.tar.gz gowerui-linux-portable/
          cp gowerui-linux-portable.tar.gz final-assets/

      - name: package (windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gowerui-windows-portable final-assets
          cp "build/bin/${{ matrix.binary_name }}" gowerui-windows-portable/
          cp "sidecar/${{ matrix.sidecar_asset }}" gowerui-windows-portable/

          {
            echo "Ejecuta gowerui.exe para iniciar la aplicacion."
            echo "No elimines ${{ matrix.sidecar_asset }}, es el motor de la aplicacion."
          } > gowerui-windows-portable/README.txt

          cd gowerui-windows-portable && 7z a ../gowerui-windows-portable.zip ./* && cd ..
          cp gowerui-windows-portable.zip final-assets/

      - name: upload assets to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: final-assets/*
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.app.outputs.version) }}
          name: "gowerui v${{ steps.app.outputs.version }}"
          body: "Automatic release. Includes the gower sidecar as a portable bundle."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}